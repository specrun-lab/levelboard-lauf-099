services:
  backend:
    build:
      context: ./backend
      args:
        SOURCE_URL: ${SOURCE_URL:-}
        REVISION: ${IMAGE_TAG:-lokal}
    image: ${IMAGE_PREFIX:-levelboard}-backend:${IMAGE_TAG:-lokal}
    environment:
      RUN_ID: ${RUN_ID:-container}
    volumes:
      - levelboard-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  frontend:
    build:
      context: ./frontend
      args:
        SOURCE_URL: ${SOURCE_URL:-}
        REVISION: ${IMAGE_TAG:-lokal}
    image: ${IMAGE_PREFIX:-levelboard}-frontend:${IMAGE_TAG:-lokal}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  levelboard-data:
